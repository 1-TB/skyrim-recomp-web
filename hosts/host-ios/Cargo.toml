[package]
name = "host-ios"
description = "Runs the recompiled title as an iOS app (a static library the Xcode project in xcode/ links)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "host_ios"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
d3d-hle.workspace = true
# Renders on Metal on Apple targets (the feature is ignored elsewhere).
gpu-webgpu = { workspace = true, features = ["metal"] }
guest-sys.workspace = true
kernel-hle.workspace = true
libc.workspace = true
log.workspace = true
runtime-core.workspace = true
vfs.workspace = true
xex.workspace = true
xenos-render.workspace = true
cpal = "0.18.2"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-ui-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-game-controller = "0.3.2"
objc2-avf-audio = "0.3.2"
