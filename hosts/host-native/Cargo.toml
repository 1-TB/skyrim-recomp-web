[package]
name = "host-native"
description = "Runs the recompiled title natively (Linux, macOS) for debugging"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "skyrim-native"
path = "src/main.rs"

[dependencies]
d3d-hle.workspace = true
# Renders on Metal on Apple targets (the feature is ignored elsewhere).
gpu-webgpu = { workspace = true, features = ["metal"] }
guest-sys.workspace = true
kernel-hle.workspace = true
libc.workspace = true
log.workspace = true
runtime-core.workspace = true
vfs.workspace = true
xex.workspace = true
xenos-render.workspace = true
winit = "0.30"
gilrs = "0.11.2"
cpal = "0.18.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
raw-window-metal = "1.1.0"
