[package]
name = "xenos-render"
description = "Renders the Xenos command stream with WebGPU on a dedicated renderer thread"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
gpu-webgpu.workspace = true
log.workspace = true
rustc-hash.workspace = true
xenos-edram.workspace = true
xenos-shader.workspace = true
xenos-state.workspace = true
xenos-texture.workspace = true
xenos-texture-cache.workspace = true

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
png = "=0.17.16"

[dev-dependencies]
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"] }
xenos-state.workspace = true
xenos-texture.workspace = true
gpu-webgpu.workspace = true
